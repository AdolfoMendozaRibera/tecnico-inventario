<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo general -->
  <rect width="390" height="844" fill="#F8FAFC"/>

  <!-- ───── STATUS BAR ───── -->
  <rect width="390" height="44" fill="#F8FAFC"/>
  <text x="20" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">9:41</text>
  <!-- Iconos status bar -->
  <rect x="340" y="18" width="22" height="10" rx="2" fill="#0F172A"/>
  <rect x="342" y="20" width="18" height="6" rx="1" fill="#F8FAFC"/>
  <rect x="364" y="20" width="2" height="6" rx="1" fill="#0F172A"/>
  <rect x="343" y="21" width="14" height="4" rx="0.5" fill="#0F172A"/>
  <circle cx="322" cy="23" r="5" stroke="#0F172A" stroke-width="1.5"/>
  <path d="M316 27 Q322 16 328 27" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M318 25 Q322 19 326 25" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <rect x="305" y="18" width="3" height="10" rx="1" fill="#0F172A"/>
  <rect x="309.5" y="20" width="3" height="8" rx="1" fill="#0F172A"/>
  <rect x="314" y="16" width="3" height="12" rx="1" fill="#0F172A"/>

  <!-- ───── APP BAR ───── -->
  <!-- Flecha back -->
  <g transform="translate(8, 50)">
    <rect width="48" height="48" rx="24" fill="transparent"/>
    <path d="M28 24 L20 24 M20 24 L25 19 M20 24 L25 29" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Título -->
  <text x="56" y="80" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.4">Reservar Repuesto</text>

  <!-- ───── DIVIDER ───── -->
  <line x1="0" y1="98" x2="390" y2="98" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ───── BODY ───── -->
  <!-- Tarjeta repuesto seleccionado -->
  <rect x="20" y="114" width="350" height="76" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <filter id="shadow1">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.03"/>
  </filter>

  <!-- Ícono círculo -->
  <circle cx="62" cy="152" r="22" fill="#F1F5F9"/>
  <!-- Ícono inventory_2_outlined simplificado -->
  <rect x="51" y="143" width="22" height="18" rx="2" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <path d="M56 143 L56 148 L68 148 L68 143" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="59" y1="153" x2="65" y2="153" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Label REPUESTO SELECCIONADO -->
  <text x="96" y="143" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">REPUESTO SELECCIONADO</text>
  <!-- Nombre del repuesto -->
  <text x="96" y="161" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Batería HP 45W</text>

  <!-- Badge Disponible -->
  <rect x="290" y="140" width="66" height="24" rx="12" fill="#DCFCE7"/>
  <text x="323" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Disponible</text>

  <!-- ───── CAMPO: Equipo Destino ───── -->
  <text x="20" y="218" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Equipo Destino *</text>

  <!-- Input Equipo -->
  <rect x="20" y="230" width="350" height="48" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Ícono devices -->
  <rect x="36" y="246" width="16" height="16" rx="2" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <line x1="40" y1="262" x2="40" y2="265" stroke="#64748B" stroke-width="1.5"/>
  <line x1="48" y1="262" x2="48" y2="265" stroke="#64748B" stroke-width="1.5"/>
  <line x1="37" y1="265" x2="51" y2="265" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="64" y="259" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Ej. Dell Latitude 5420 - N° 102</text>

  <!-- ───── CAMPO: Motivo ───── -->
  <text x="20" y="302" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Motivo de la reserva (Opcional)</text>

  <!-- Input Motivo (multiline) -->
  <rect x="20" y="314" width="350" height="88" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Ícono description -->
  <rect x="36" y="330" width="16" height="20" rx="1" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <line x1="39" y1="335" x2="48" y2="335" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="339" x2="48" y2="339" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="343" x2="45" y2="343" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="64" y="335" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Ej. Mantenimiento programado o</text>
  <text x="64" y="353" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">cambio de pantalla rota</text>

  <!-- ───── BOTÓN PRIMARIO: Confirmar Reserva ───── -->
  <rect x="20" y="434" width="350" height="52" rx="12" fill="#1E293B"/>
  <text x="195" y="465" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Confirmar Reserva</text>

  <!-- ───── BOTÓN SECUNDARIO: Cancelar ───── -->
  <text x="195" y="515" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">Cancelar</text>

  <!-- ───── HOME INDICATOR ───── -->
  <rect x="148" y="820" width="94" height="5" rx="2.5" fill="#CBD5E1"/>
</svg>
