    <rect x="80" y="10" width="80" height="16" rx="8" fill="#1E293B"/>
    <!-- Mockup Card 1 -->
    <rect x="20" y="50" width="200" height="80" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="80" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Pantalla AMOLED</text>
    <text x="35" y="100" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Caja B3 - Estante 2</text>
    <rect x="145" y="68" width="60" height="22" rx="6" fill="rgba(16,185,129,0.2)"/>
    <text x="175" y="83" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">4 disp.</text>
    <!-- Mockup Card 2 -->
    <rect x="20" y="145" width="200" height="90" rx="14" fill="#0F172A" stroke="rgba(16,185,129,0.4)"/>
    <text x="35" y="175" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Reserva Atómica</text>
    <text x="35" y="195" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11">🔒 Confirmada en BD</text>
    <!-- Mockup Card 3 -->
    <rect x="20" y="250" width="200" height="75" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="280" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Batería BN59 5000mAh</text>
    <text x="35" y="300" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Uso parcial: 3 de 5</text>
