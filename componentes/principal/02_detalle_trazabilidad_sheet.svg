<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FONDO CON BACKDROP OSCURO -->
  <rect width="390" height="844" fill="#0F172A" fill-opacity="0.5"/>

  <!-- MODAL BOTTOM SHEET CONTAINER -->
  <g id="ModalBottomSheet_Instalado">
    <!-- Contenedor blanco con bordes superiores redondeados 24px -->
    <path d="M0 160C0 146.745 10.7452 136 24 136H366C379.255 136 390 146.745 390 160V844H0V160Z" fill="#FFFFFF"/>

    <!-- Handle Bar de arrastre -->
    <rect x="173" y="148" width="44" height="5" rx="2.5" fill="#CBD5E1"/>

    <!-- CABECERA: TÍTULO + BADGE INSTALADO -->
    <g id="Header_Ficha">
      <text x="24" y="196" fill="#0F172A" font-family="Inter, sans-serif" font-size="20" font-weight="800">Ficha de Trazabilidad</text>
      
      <!-- Subtítulo / Nombre de la pieza -->
      <text x="24" y="222" fill="#0F172A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Pc</text>

      <!-- Badge Verde ✔ Instalado -->
      <rect x="264" y="178" width="102" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
      <!-- Icono Check circular verde -->
      <circle cx="278" cy="192" r="6" fill="#059669"/>
      <path d="M275.5 192L277.5 194L281 189.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="290" y="196" fill="#047857" font-family="Inter, sans-serif" font-size="12" font-weight="700">Instalado</text>
    </g>

    <!-- 3 CHIPS: CATEGORÍA + SKU + CANTIDAD -->
    <g id="Chips_Info">
      <!-- Chip Categoría (PANTALLAS) -->
      <rect x="24" y="244" width="94" height="28" rx="8" fill="#EFF6FF"/>
      <text x="35" y="262" fill="#1D4ED8" font-family="Inter, sans-serif" font-size="11" font-weight="700">PANTALLAS</text>

      <!-- Chip SKU -->
      <rect x="124" y="244" width="144" height="28" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="136" y="262" fill="#334155" font-family="Inter, sans-serif" font-size="11" font-weight="600">SKU: REP-8849-LCD</text>

      <!-- Chip Cantidad -->
      <rect x="274" y="244" width="76" height="28" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="286" y="262" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="700">1 unidad</text>
    </g>

    <!-- TARJETA PRINCIPAL (DETALLES DEL MOVIMIENTO) -->
    <g id="Card_Detalles_Equipo">
      <rect x="24" y="292" width="342" height="196" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

      <!-- Fila 1: Equipo Destino -->
      <rect x="42" y="312" width="16" height="12" rx="2" stroke="#2563EB" stroke-width="1.5" fill="#EFF6FF"/>
      <line x1="40" y1="326" x2="60" y2="326" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
      <text x="68" y="318" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">EQUIPO / DISPOSITIVO DESTINO</text>
      <text x="68" y="337" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="800">NVIDIA</text>

      <!-- Divisor 1 -->
      <line x1="42" y1="354" x2="348" y2="354" stroke="#F1F5F9" stroke-width="1"/>

      <!-- Fila 2: Motivo Registrado -->
      <path d="M44 370H56L60 374V388H44V370Z" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
      <text x="68" y="375" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">MOTIVO REGISTRADO</text>
      <text x="68" y="394" fill="#334155" font-family="Inter, sans-serif" font-size="13" font-weight="500">1232132sadasd</text>

      <!-- Divisor 2 -->
      <line x1="42" y1="412" x2="348" y2="412" stroke="#F1F5F9" stroke-width="1"/>

      <!-- Fila 3: Técnico y Fecha -->
      <!-- Icono Persona -->
      <circle cx="48" cy="431" r="3.5" stroke="#64748B" stroke-width="1.2"/>
      <path d="M43 440C43 437 45.5 435.5 48 435.5C50.5 435.5 53 437 53 440" stroke="#64748B" stroke-width="1.2"/>
      <text x="62" y="437" fill="#334155" font-family="Inter, sans-serif" font-size="12" font-weight="600">Por: <tspan font-weight="500">tecnico@taller.com</tspan></text>

      <!-- Icono Reloj -->
      <circle cx="48" cy="460" r="5" stroke="#64748B" stroke-width="1.2"/>
      <path d="M48 457V460L50.5 462" stroke="#64748B" stroke-width="1.2"/>
      <text x="62" y="464" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="500">17/09/2026 a las 21:58</text>
    </g>

    <!-- TARJETA NOTAS TÉCNICAS Y COMPATIBILIDAD -->
    <g id="Card_NotasTecnicas">
      <rect x="24" y="504" width="342" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="40" y="526" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">NOTAS TÉCNICAS Y COMPATIBILIDAD</text>
      <text x="40" y="548" fill="#334155" font-family="Inter, sans-serif" font-size="13" font-weight="500">dasdsad</text>
    </g>

    <!-- BOTÓN PRINCIPAL: ENTENDIDO / CERRAR -->
    <g id="BotonCerrar">
      <rect x="24" y="600" width="342" height="50" rx="14" fill="#1E293B"/>
      <text x="134" y="631" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">Entendido / Cerrar</text>
    </g>
  </g>
</svg>
