<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FONDO CON BACKDROP OSCURO -->
  <rect width="390" height="844" fill="#0F172A" fill-opacity="0.5"/>

  <!-- MODAL BOTTOM SHEET CONTAINER -->
  <g id="ModalBottomSheet_Baja">
    <!-- Contenedor blanco con bordes redondeados 24px -->
    <path d="M0 160C0 146.745 10.7452 136 24 136H366C379.255 136 390 146.745 390 160V844H0V160Z" fill="#FFFFFF"/>

    <!-- Handle Bar de arrastre -->
    <rect x="173" y="148" width="44" height="5" rx="2.5" fill="#CBD5E1"/>

    <!-- CABECERA: TÍTULO + BADGE BAJA / MERMA -->
    <g id="Header_Ficha_Baja">
      <text x="24" y="196" fill="#0F172A" font-family="Inter, sans-serif" font-size="20" font-weight="800">Ficha de Trazabilidad</text>
      
      <!-- Subtítulo / Nombre de la pieza -->
      <text x="24" y="222" fill="#0F172A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Tarjeta grafica</text>

      <!-- Badge Rojo 🗑 Baja / Merma -->
      <rect x="244" y="178" width="122" height="28" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
      <!-- Icono Basurero / Papelera rojo -->
      <path d="M258 187H268M260 187V197C260 198 261 198.5 262 198.5H266C267 198.5 268 198 268 197V187" stroke="#DC2626" stroke-width="1.3" stroke-linecap="round"/>
      <text x="274" y="196" fill="#DC2626" font-family="Inter, sans-serif" font-size="11" font-weight="700">Baja / Merma</text>
    </g>

    <!-- 3 CHIPS: CATEGORÍA + SKU + CANTIDAD -->
    <g id="Chips_Info_Baja">
      <!-- Chip Categoría (OTROS) -->
      <rect x="24" y="244" width="68" height="28" rx="8" fill="#EFF6FF"/>
      <text x="35" y="262" fill="#1D4ED8" font-family="Inter, sans-serif" font-size="11" font-weight="700">OTROS</text>

      <!-- Chip SKU -->
      <rect x="98" y="244" width="144" height="28" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="110" y="262" fill="#334155" font-family="Inter, sans-serif" font-size="11" font-weight="600">SKU: REP-8849-LCD</text>

      <!-- Chip Cantidad -->
      <rect x="248" y="244" width="76" height="28" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="260" y="262" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="700">1 unidad</text>
    </g>

    <!-- TARJETA PRINCIPAL (DETALLES DEL DESCARTE) -->
    <g id="Card_Detalles_Baja">
      <rect x="24" y="292" width="342" height="212" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

      <!-- Fila 1: Tipo de Salida -->
      <!-- Icono Alerta Triángulo rojo -->
      <path d="M48 312L56 326H40L48 312Z" stroke="#EF4444" stroke-width="1.5" fill="#FEF2F2"/>
      <line x1="48" y1="317" x2="48" y2="320" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="48" cy="323" r="0.75" fill="#EF4444"/>

      <text x="68" y="318" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">TIPO DE SALIDA</text>
      <text x="68" y="337" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="800">Descarte por daño</text>

      <!-- Divisor 1 -->
      <line x1="42" y1="354" x2="348" y2="354" stroke="#F1F5F9" stroke-width="1"/>

      <!-- Fila 2: Motivo Registrado -->
      <path d="M44 370H56L60 374V388H44V370Z" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
      <text x="68" y="375" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">MOTIVO REGISTRADO</text>
      <text x="68" y="394" fill="#334155" font-family="Inter, sans-serif" font-size="12" font-weight="500">
        <tspan x="68" dy="0">Baja: Pieza Rota / Daño Físico • Se rompio</tspan>
        <tspan x="68" dy="16">el no se que, o se mojo</tspan>
      </text>

      <!-- Divisor 2 -->
      <line x1="42" y1="428" x2="348" y2="428" stroke="#F1F5F9" stroke-width="1"/>

      <!-- Fila 3: Técnico y Fecha -->
      <!-- Icono Persona -->
      <circle cx="48" cy="447" r="3.5" stroke="#64748B" stroke-width="1.2"/>
      <path d="M43 456C43 453 45.5 451.5 48 451.5C50.5 451.5 53 453 53 456" stroke="#64748B" stroke-width="1.2"/>
      <text x="62" y="453" fill="#334155" font-family="Inter, sans-serif" font-size="12" font-weight="600">Por: <tspan font-weight="500">Técnico de turno</tspan></text>

      <!-- Icono Reloj -->
      <circle cx="48" cy="476" r="5" stroke="#64748B" stroke-width="1.2"/>
      <path d="M48 473V476L50.5 478" stroke="#64748B" stroke-width="1.2"/>
      <text x="62" y="480" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="500">20/09/2026 a las 19:33</text>
    </g>

    <!-- TARJETA NOTAS TÉCNICAS Y COMPATIBILIDAD -->
    <g id="Card_NotasTecnicas_Baja">
      <rect x="24" y="520" width="342" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="40" y="542" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">NOTAS TÉCNICAS Y COMPATIBILIDAD</text>
      <text x="40" y="564" fill="#334155" font-family="Inter, sans-serif" font-size="13" font-weight="500">Que se yo</text>
    </g>

    <!-- BOTÓN PRINCIPAL: ENTENDIDO / CERRAR -->
    <g id="BotonCerrar_Baja">
      <rect x="24" y="614" width="342" height="50" rx="14" fill="#1E293B"/>
      <text x="134" y="645" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">Entendido / Cerrar</text>
    </g>
  </g>
</svg>
