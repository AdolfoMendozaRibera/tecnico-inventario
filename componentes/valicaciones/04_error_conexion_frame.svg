      <path d="M162 589V593H158" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="168" y="600" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">Reintentar</text>
    </g>
