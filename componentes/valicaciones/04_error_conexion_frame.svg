    <g id="CloudOffIcon">
      <path d="M178 480C174.5 480 171.5 478.5 169.5 476C166 475.5 163 472.5 163 468.5C163 464.5 166.5 461 170.5 461C171.2 461 172 461.2 172.6 461.5C174.2 456.8 178.6 453.5 183.8 453.5C188.5 453.5 192.6 456.2 194.5 460.2C196 459.2 198 458.5 200 458.5C204.5 458.5 208.2 462 208.5 466.5C211 467.5 213 470 213 473C213 477 209.8 480 206 480H178Z" stroke="#EF4444" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Línea diagonal de corte -->
      <line x1="166" y1="454" x2="210" y2="482" stroke="#EF4444" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- Título de Error -->
