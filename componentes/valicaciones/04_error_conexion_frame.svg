    <path d="M38 162L42 166L50 157" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="152" fill="#0F172A" font-family="Inter, sans-serif" font-size="24" font-weight="700">2</text>
